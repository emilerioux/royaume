<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>La Quête du Chevalier</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#1b1410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="La Quête">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div id="game">
    <canvas id="c"></canvas>

    <!-- HUD -->
    <div id="hud" hidden>
      <div id="hearts"></div>
      <div id="gold"><span class="coin">◆</span><span id="gold-n">0</span></div>
      <div id="tracker" hidden></div>
      <button id="menu-btn" aria-label="Journal">☰</button>
    </div>

    <!-- Contrôles tactiles -->
    <div id="pad" hidden>
      <div id="stick"><div id="knob"></div></div>
      <div id="abtns">
        <button id="btn-b" aria-label="Parler / fouiller">✋</button>
        <button id="btn-a" aria-label="Frapper">⚔️</button>
      </div>
    </div>

    <div id="toasts"></div>

    <!-- Dialogue -->
    <div id="dialogue" hidden>
      <div id="dlg-name"></div>
      <div id="dlg-text"></div>
      <div id="dlg-hint">▼</div>
    </div>

    <!-- Écran-titre -->
    <div id="title" class="screen title">
      <div class="title-inner">
        <div class="emblem" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M12 44 L16 30 L22 27 L28 27 L33 30 L37 44 Z" fill="#8c8578"/>
            <path d="M27 27 L37 31 L34 44 L27 44 Z" fill="#5c574b"/>
            <rect x="22" y="14" width="4" height="17" fill="#c9ccd2"/>
            <rect x="22.6" y="14" width="1.2" height="15" fill="#fff" opacity=".7"/>
            <rect x="15" y="12" width="18" height="4" rx="2" fill="#cf9f52"/>
            <rect x="15.5" y="12.6" width="17" height="1.1" fill="#f0cf8a"/>
            <rect x="22" y="7" width="4" height="6" rx="1.4" fill="#3a2a1a"/>
            <circle cx="24" cy="6" r="3" fill="#e6c07e"/>
            <circle cx="23" cy="5" r=".9" fill="#fff" opacity=".7"/>
          </svg>
        </div>
        <h1><span>La Quête</span><span>du Chevalier</span></h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="sub">Un royaume, une lame, une contrée à parcourir.</p>
        <div class="title-actions">
          <button id="btn-continue" class="big" hidden>Continuer</button>
          <p id="continue-sub" hidden></p>
          <button id="btn-new" class="big">Nouvelle partie</button>
        </div>
      </div>
      <p class="hint-line">Joystick&nbsp;: marcher&nbsp;·&nbsp;⚔️&nbsp;frapper&nbsp;·&nbsp;✋&nbsp;parler</p>
      <span class="version">v1 · automne 2026</span>
    </div>

    <!-- Journal -->
    <div id="menu" class="screen" hidden>
      <h2>Journal</h2>
      <div class="scroll">
        <h3>Quêtes</h3>
        <div id="menu-quests"></div>
        <h3>Sac</h3>
        <div id="menu-bag"></div>
      </div>
      <button id="btn-resume" class="big">Reprendre</button>
      <button id="btn-quit" class="small">Abandonner (retour au titre)</button>
    </div>

    <!-- Échoppe -->
    <div id="shop" class="screen" hidden>
      <h2>Échoppe du village</h2>
      <div id="shop-gold" class="shopgold"></div>
      <div id="shop-items"></div>
      <button id="btn-shop-close" class="big">Quitter l'échoppe</button>
    </div>

    <!-- Game over -->
    <div id="over" class="screen" hidden>
      <h2>Tu es tombé…</h2>
      <p id="over-sub" class="sub"></p>
      <button id="btn-revive" class="big">Se relever au village</button>
    </div>

    <div id="fade" aria-hidden="true"></div>
  </div>

  <script src="game.js?v=7"></script>
</body>
</html>
