<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Icône — L'épée dans la pierre</title>
<style>
  html, body { margin: 0; background: #222; }
  #wrap { display: grid; place-items: center; min-height: 100vh; gap: 20px; padding: 20px; }
  canvas { image-rendering: auto; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #masked { border-radius: 22.5%; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #masked canvas { box-shadow: none; display: block; }
  p { color: #aaa; font: 13px system-ui; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="512" height="512"></canvas>
  <div id="masked"><canvas id="cm" width="240" height="240"></canvas></div>
  <p>Rendu de l'icône « L'épée dans la pierre » — <span id="sz"></span> px (à gauche : PNG plein cadre ; à droite : aperçu masqué façon écran d'accueil).
     Ajouter <code>?size=192</code> ou <code>?size=180</code> à l'URL pour d'autres tailles.</p>
</div>
<script>
/* Icône « L'épée dans la pierre » — dessin vectoriel, espace logique 100x100. */
const PAL = {
  skyHi: "#f3d99f", skyMid: "#e0ac6a", ground: "#7c8b4c", groundLo: "#55642f",
  steelHi: "#e4e8ec", steel: "#9aa0a8", steelLo: "#4a4f58",
  gold: "#cf9f52", goldHi: "#f0cf8a", goldLo: "#8a6a33",
  stoneHi: "#b8b0a0", stone: "#8c8578", stoneLo: "#5c574b", crack: "#2c2820",
  olive: "#67783e", oliveHi: "#93a25a",
};

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawIcon(ctx) {
  // ---- ciel
  let g = ctx.createLinearGradient(0, 0, 0, 64);
  g.addColorStop(0, PAL.skyHi); g.addColorStop(1, PAL.skyMid);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 100, 64);
  // ---- sol
  g = ctx.createLinearGradient(0, 54, 0, 100);
  g.addColorStop(0, PAL.oliveHi); g.addColorStop(1, PAL.groundLo);
  ctx.fillStyle = g; ctx.fillRect(0, 58, 100, 42);
  // ---- fondu d'horizon
  g = ctx.createLinearGradient(0, 53, 0, 63);
  g.addColorStop(0, PAL.skyMid); g.addColorStop(1, "rgba(147,162,90,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 53, 100, 10);
  // ---- halo de soleil
  g = ctx.createRadialGradient(50, 28, 2, 50, 30, 50);
  g.addColorStop(0, "rgba(255,248,222,.5)"); g.addColorStop(1, "rgba(255,248,222,0)");
  ctx.save(); ctx.globalCompositeOperation = "screen"; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(50, 28, 50, 0, 7); ctx.fill(); ctx.restore();
  // ---- un rai discret
  ctx.save(); ctx.globalCompositeOperation = "screen"; ctx.fillStyle = "rgba(255,236,185,.06)";
  ctx.beginPath(); ctx.moveTo(20, -6); ctx.lineTo(30, -6); ctx.lineTo(64, 72); ctx.lineTo(48, 72); ctx.closePath(); ctx.fill();
  ctx.restore();
  // ---- colline
  ctx.fillStyle = PAL.olive;
  ctx.beginPath();
  ctx.moveTo(-4, 100);
  ctx.quadraticCurveTo(30, 74, 50, 76);
  ctx.quadraticCurveTo(72, 78, 104, 100);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(160,180,100,.35)";
  ctx.beginPath(); ctx.ellipse(34, 82, 22, 5, -0.25, 0, 7); ctx.fill();
  // ---- ombre portée du rocher
  ctx.fillStyle = "rgba(30,30,20,.18)";
  ctx.beginPath(); ctx.ellipse(56, 86, 26, 6, 0, 0, 7); ctx.fill();

  // ---- rocher (silhouette anguleuse nette)
  const rock = () => {
    ctx.beginPath();
    ctx.moveTo(31, 86);
    ctx.lineTo(35, 60);
    ctx.lineTo(44, 55);
    ctx.lineTo(56, 56);
    ctx.lineTo(65, 61);
    ctx.lineTo(69, 86);
    ctx.closePath();
  };
  rock();
  g = ctx.createLinearGradient(31, 55, 69, 86);
  g.addColorStop(0, PAL.stoneHi); g.addColorStop(0.55, PAL.stone); g.addColorStop(1, PAL.stoneLo);
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); rock(); ctx.clip();
  // facette d'ombre (droite)
  ctx.fillStyle = "rgba(30,28,24,.32)";
  ctx.beginPath(); ctx.moveTo(52, 55); ctx.lineTo(69, 62); ctx.lineTo(64, 86); ctx.lineTo(52, 86); ctx.closePath(); ctx.fill();
  // arête de lumière (haut-gauche)
  ctx.fillStyle = "rgba(255,246,225,.28)";
  ctx.beginPath(); ctx.moveTo(35, 60); ctx.lineTo(44, 55); ctx.lineTo(45, 60); ctx.lineTo(37, 65); ctx.closePath(); ctx.fill();
  // fissure autour de la lame
  ctx.strokeStyle = PAL.crack; ctx.lineWidth = 1.4; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(45, 58); ctx.lineTo(48, 62); ctx.lineTo(46, 68);
  ctx.moveTo(55, 58); ctx.lineTo(52, 63); ctx.lineTo(54, 70);
  ctx.stroke();
  ctx.restore();

  // ---- lame
  g = ctx.createLinearGradient(45, 0, 55, 0);
  g.addColorStop(0, PAL.steel); g.addColorStop(0.28, PAL.steelHi);
  g.addColorStop(0.6, PAL.steel); g.addColorStop(1, PAL.steelLo);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(46, 30); ctx.lineTo(54, 30); ctx.lineTo(52.5, 63); ctx.lineTo(47.5, 63); ctx.closePath();
  ctx.fill();
  // pointe qui émerge (petit reflet fort en haut)
  ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fillRect(46.6, 30, 1.5, 30);
  // gouttière
  ctx.strokeStyle = "rgba(40,44,52,.5)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(50, 31); ctx.lineTo(50, 60); ctx.stroke();

  // ---- garde (croix large, biseautée)
  g = ctx.createLinearGradient(0, 26, 0, 35);
  g.addColorStop(0, PAL.goldHi); g.addColorStop(0.5, PAL.gold); g.addColorStop(1, PAL.goldLo);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(30, 30.5);
  ctx.quadraticCurveTo(31, 26.5, 36, 26.5);
  ctx.lineTo(64, 26.5);
  ctx.quadraticCurveTo(69, 26.5, 70, 30.5);
  ctx.quadraticCurveTo(69, 34.5, 64, 34.5);
  ctx.lineTo(36, 34.5);
  ctx.quadraticCurveTo(31, 34.5, 30, 30.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.32)"; ctx.fillRect(34, 27.6, 32, 1.4);
  ctx.fillStyle = "rgba(90,66,20,.35)"; ctx.fillRect(34, 33, 32, 1.2);

  // ---- poignée
  g = ctx.createLinearGradient(47.4, 0, 52.6, 0);
  g.addColorStop(0, "#4a3524"); g.addColorStop(0.5, "#3a2a1a"); g.addColorStop(1, "#241a10");
  ctx.fillStyle = g;
  rr(ctx, 47.4, 18, 5.2, 9, 2); ctx.fill();
  ctx.strokeStyle = "rgba(18,12,7,.5)"; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(47.4, 21); ctx.lineTo(52.6, 21); ctx.moveTo(47.4, 24); ctx.lineTo(52.6, 24); ctx.stroke();

  // ---- pommeau
  g = ctx.createRadialGradient(48.5, 13, 0.5, 50, 15, 5);
  g.addColorStop(0, PAL.goldHi); g.addColorStop(1, PAL.goldLo);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(50, 15, 4.4, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.beginPath(); ctx.arc(48.4, 13.6, 1.1, 0, 7); ctx.fill();

  // ---- deux brins d'herbe discrets au pied du rocher
  ctx.strokeStyle = "rgba(120,140,75,.9)"; ctx.lineWidth = 1.3; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(29, 88); ctx.quadraticCurveTo(27.5, 83, 30, 79);
  ctx.moveTo(71, 88); ctx.quadraticCurveTo(73.5, 84, 71, 79);
  ctx.stroke();
}

function paint(cv, size) {
  cv.width = cv.height = size;
  const ctx = cv.getContext("2d");
  ctx.setTransform(size / 100, 0, 0, size / 100, 0, 0);
  ctx.imageSmoothingEnabled = true;
  drawIcon(ctx);
}
const size = Math.max(16, Math.min(1024, parseInt(new URLSearchParams(location.search).get("size")) || 512));
document.getElementById("sz").textContent = size;
paint(document.getElementById("c"), size);
paint(document.getElementById("cm"), 240);
</script>
</body>
</html>
